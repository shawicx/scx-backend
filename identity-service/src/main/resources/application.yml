# identity-service 配置（身份认证服务）
spring:
  application:
    name: scx-identity
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:file:.env[.properties]"

  # 数据源（JPA）—— 共享库 + 逻辑隔离：identity 仅访问 users / user_roles 表
  # 过渡期 UserService 仍直连 rbac 的 roles/permissions 表（Step 6 后改为 RestClient）
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_DATABASE:scx-backend}
    username: ${DB_USERNAME:scx}
    password: ${DB_PASSWORD:scx_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Redis（令牌存储 + 验证码）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6388}
      password: ${REDIS_PASSWORD:}

  # 邮件（过渡期 identity 依赖 notification 模块的 MailService 实现，
  # 需 mail.enabled 触发其条件装配。Step 8 后改为 RestClient 调 notification）
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:noreply@example.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.trust: ${MAIL_HOST:smtp.example.com}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  thymeleaf:
    cache: false

# 邮件模块开关（控制 notification 的 SmtpMailService / StubMailService 装配）
mail:
  enabled: ${MAIL_ENABLED:true}
  timeout-ms: ${MAIL_TIMEOUT_MS:30000}

app:
  name: ${APP_NAME:SCX Service}

# JWT 配置（HMAC-SHA256 令牌密钥，必须与 gateway 一致）
jwt:
  secret: ${JWT_SECRET:default-secret}

# 超级管理员初始密码（首次启动 SeedService 创建超管用户用，生产必须覆盖）
admin:
  initial-password: ${ADMIN_INITIAL_PASSWORD:changeme123}

swagger:
  enabled: ${SWAGGER_ENABLED:true}
  title: ${SWAGGER_TITLE:SCX Identity API}
  description: ${SWAGGER_DESCRIPTION:SCX Identity Service API}
  version: ${SWAGGER_VERSION:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${IDENTITY_PORT:3001}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.scx.backend: DEBUG
