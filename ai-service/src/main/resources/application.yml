# ai-service 配置（AI 对话服务）
spring:
  application:
    name: scx-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 加载项目根目录的 .env 文件（与单体时代一致）
  config:
    import: "optional:file:.env[.properties]"

  # 数据源（JPA）—— 共享库 + 逻辑隔离：ai-service 访问 ai_model_configs / ai_messages
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_DATABASE:scx-backend}
    username: ${DB_USERNAME:scx}
    password: ${DB_PASSWORD:scx_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 单库多服务：放行"库中已应用但本服务 classpath 没有"的迁移（低于本地版本视野为 missing，高于为 future）
    ignore-migration-patterns: "*:missing,*:future"

# AI 模型配置加密密钥（AES-256-GCM，密钥经 SHA-256 派生）；
# 未配置时回退派生自 jwt.secret，生产环境建议独立设置
ai:
  config-secret: ${AI_CONFIG_SECRET:}

# 与 gateway/identity 共用的 HMAC 密钥（此处仅作为加密回退派生源）
jwt:
  secret: ${JWT_SECRET:default-secret}

# Swagger
swagger:
  enabled: ${SWAGGER_ENABLED:true}
  title: ${SWAGGER_TITLE:SCX AI API}
  description: ${SWAGGER_DESCRIPTION:SCX AI Service API}
  version: ${SWAGGER_VERSION:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${AI_PORT:3005}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.scx.backend: DEBUG
