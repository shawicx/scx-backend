# file-service 配置（文件服务）
spring:
  application:
    name: scx-file
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:file:.env[.properties]"

  # 数据源（JPA）—— 共享库 + 逻辑隔离：file-service 仅访问 files 表
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_DATABASE:scx-backend}
    username: ${DB_USERNAME:scx}
    password: ${DB_PASSWORD:scx_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

swagger:
  enabled: ${SWAGGER_ENABLED:true}
  title: ${SWAGGER_TITLE:SCX File API}
  description: ${SWAGGER_DESCRIPTION:SCX File Service API}
  version: ${SWAGGER_VERSION:1.0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${FILE_PORT:3004}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.scx.backend: DEBUG
