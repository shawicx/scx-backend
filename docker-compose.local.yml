# ============================================================
# scx-backend 本机容器编排（OrbStack / Docker 均可）
# ------------------------------------------------------------
# 仅 5 个应用服务：PG/Redis 直连 ECS 共享基础设施（scx-infra，
# 120.77.144.112:5433/6388，公网 + 密码），MinIO 用 .env 里的 ECS 公网地址。
# 连本地数据卷的场景（日常开发）请用 ./gradlew bootRun + 本机 scx-infra。
#
# 使用方式：
#   1. 构建镜像（Boot 4 的 bootBuildImage 默认 tag 为 latest）：
#      ./gradlew :gateway:bootBuildImage :identity-service:bootBuildImage \
#                :rbac-service:bootBuildImage :notification-service:bootBuildImage \
#                :file-service:bootBuildImage -x test
#   2. 启动：docker compose -f docker-compose.local.yml up -d
#   3. 对外入口：http://localhost:8080/api（网关）
#
# 注意：不占用本机 5433/6388（与 scx-infra 无冲突），但服务端口与
# bootRun 模式相同（8080/3001-3004），两种模式不要同时启动。
# ============================================================

services:
  identity-service:
    image: docker.io/library/identity-service:latest
    container_name: scx-identity
    # env_file 提供密码/JWT/邮件等；environment 定向覆盖为 ECS 基础设施
    env_file: [ .env ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: 120.77.144.112
      REDIS_HOST: 120.77.144.112
    ports:
      - "3001:3001"
    restart: unless-stopped

  rbac-service:
    image: docker.io/library/rbac-service:latest
    container_name: scx-rbac
    env_file: [ .env ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: 120.77.144.112
    ports:
      - "3002:3002"
    restart: unless-stopped

  notification-service:
    image: docker.io/library/notification-service:latest
    container_name: scx-notification
    env_file: [ .env ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "3003:3003"
    restart: unless-stopped

  file-service:
    image: docker.io/library/file-service:latest
    container_name: scx-file
    env_file: [ .env ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: 120.77.144.112
    ports:
      - "3004:3004"
    restart: unless-stopped

  gateway:
    image: docker.io/library/gateway:latest
    container_name: scx-gateway
    env_file: [ .env ]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      REDIS_HOST: 120.77.144.112
      # 容器间走 compose 网络服务名
      IDENTITY_BASE_URL: http://identity-service:3001
      RBAC_BASE_URL: http://rbac-service:3002
      NOTIFICATION_BASE_URL: http://notification-service:3003
      FILE_BASE_URL: http://file-service:3004
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - rbac-service
      - notification-service
      - file-service
    restart: unless-stopped
