# ============================================================
# @description SCX Backend 微服务自动部署工作流
# ------------------------------------------------------------
# 触发条件：
#   - push 到 main 分支：构建 5 个服务镜像 → 推送 ACR → SSH 部署到 ECS
#   - workflow_dispatch：手动触发（紧急重试/回滚）
#
# 部署链路（多服务）：
#   ./gradlew :<service>:bootBuildImage（5 个服务）
#   → docker tag → docker push (阿里云 ACR)
#   → SSH 登录 ECS → docker pull
#   → 幂等启动 PostgreSQL + Redis 依赖
#   → 启动 5 个服务容器（gateway 对外 8080，其余内部通信）
#   → 健康检查（轮询网关 /api/health）
#
# 服务拓扑（ECS host 网络）：
#   客户端 → gateway(8080) → identity(3001) / rbac(3002) / notification(3003) / file(3004)
#   仅网关对外暴露；下游服务通过 localhost:<port> 内部通信
#
# 安全模型：
#   - 生产秘钥（DB/JWT/MAIL 等）只存在于 ECS 本地 .env 文件，通过 docker run --env-file 注入
#   - GitHub 仅保存 ACR 凭证与 ECS SSH 凭证
#   - --network host：复用宿主网络，各服务 localhost:<port> 直连
#
# 依赖的 GitHub Secrets（与单体时代一致）：
#   ACR_REGISTRY / ACR_NAMESPACE / ACR_USERNAME / ACR_PASSWORD
#   ECS_HOST / ECS_USER / ECS_SSH_KEY / ECS_ENV_FILE
# ============================================================

name: Deploy to Aliyun ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 最小权限：两个 job 均不使用 GITHUB_TOKEN（ACR/ECS 凭证来自 secrets），
# 显式撤销其全部权限，遵循 least-privilege 原则，降低凭证泄露时的影响面。
permissions: {}

# 同一分支并发部署时取消旧的，避免重复滚动
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1：构建 5 个服务镜像并推送到阿里云 ACR
  # ============================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build OCI images (bootBuildImage)
        # 为每个服务构建镜像。Spring Boot 4 的 bootBuildImage 默认产出：
        #   docker.io/library/<模块名>:latest（注意：Boot 4 默认 tag 是 latest，不是 version）
        # 默认 profile：prod（各模块 build.gradle.kts 已配置）
        run: ./gradlew :gateway:bootBuildImage :identity-service:bootBuildImage :rbac-service:bootBuildImage :notification-service:bootBuildImage :file-service:bootBuildImage --no-daemon -x test

      - name: Login to Aliyun ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" \
            -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Tag & Push images
        env:
          TARGET_NS: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT="${SHORT_SHA:0:7}"
          # 5 个服务的镜像名（与 Gradle 模块名一致）
          SERVICES=(gateway identity-service rbac-service notification-service file-service)

          for SVC in "${SERVICES[@]}"; do
            # Spring Boot 4 bootBuildImage 默认 tag 是 latest（不是 version）
            SOURCE="docker.io/library/${SVC}:latest"
            TARGET="$TARGET_NS/${SVC}"
            echo "==> 推送 $SVC"
            docker tag "$SOURCE" "$TARGET:latest"
            docker tag "$SOURCE" "$TARGET:sha-$SHORT"
            docker push "$TARGET:latest"
            docker push "$TARGET:sha-$SHORT"
            echo "    ✓ $TARGET:latest (sha-$SHORT)"
          done

  # ============================================================
  # Job 2：SSH 登录 ECS，拉取镜像并启动全部服务容器
  # ============================================================
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: SSH deploy & health check
        uses: appleboy/ssh-action@v1
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ECS_ENV_FILE: ${{ secrets.ECS_ENV_FILE }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          command_timeout: 15m
          envs: ACR_REGISTRY,ACR_NAMESPACE,ACR_USERNAME,ACR_PASSWORD,ECS_ENV_FILE
          # 远端部署脚本：
          # 1. 校验 .env / 登录 ACR
          # 2. 拉取 5 个服务镜像
          # 3. 幂等启动 PG + Redis 依赖
          # 4. 等待 PG 就绪
          # 5. 启动 5 个服务容器（仅 gateway 对外，--env-file 注入生产配置）
          # 6. 健康检查（轮询网关 /api/health）
          script: |
            set -euo pipefail

            NS="$ACR_REGISTRY/$ACR_NAMESPACE"
            ENV_FILE="$ECS_ENV_FILE"
            SERVICES=(gateway identity-service rbac-service notification-service file-service)

            echo "==> 校验 .env 文件存在: $ENV_FILE"
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: ECS 上的 .env 文件不存在: $ENV_FILE"
              echo "请先在 ECS 上创建该文件并写入生产环境变量（参考 .env.example）"
              exit 1
            fi

            echo "==> 登录阿里云 ACR"
            docker login "$ACR_REGISTRY" -u "$ACR_USERNAME" -p "$ACR_PASSWORD"

            # 拉取全部服务镜像
            for SVC in "${SERVICES[@]}"; do
              echo "==> 拉取镜像: $NS/$SVC:latest"
              docker pull "$NS/$SVC:latest"
            done

            # ============================================================
            # 确保依赖容器（PostgreSQL + Redis）运行（幂等）
            # ============================================================
            echo "==> 确保依赖容器（PostgreSQL + Redis）运行"

            if docker ps -a --format '{{.Names}}' | grep -q '^scx-backend-postgres$'; then
              echo "  PostgreSQL 容器已存在，确保运行中"
              docker start scx-backend-postgres >/dev/null 2>&1 || true
            else
              echo "  PostgreSQL 容器不存在，创建并启动"
              docker run -d \
                --name scx-backend-postgres \
                --network host \
                --restart unless-stopped \
                -e POSTGRES_USER=scx \
                -e POSTGRES_PASSWORD=scx_password \
                -e POSTGRES_DB=scx-backend \
                -v scx-backend-postgres-data:/var/lib/postgresql/data \
                postgres:16-alpine \
                postgres -c port=5433
            fi

            if docker ps -a --format '{{.Names}}' | grep -q '^scx-backend-redis$'; then
              echo "  Redis 容器已存在，确保运行中"
              docker start scx-backend-redis >/dev/null 2>&1 || true
            else
              echo "  Redis 容器不存在，创建并启动"
              docker run -d \
                --name scx-backend-redis \
                --network host \
                --restart unless-stopped \
                -v scx-backend-redis-data:/data \
                redis:7-alpine \
                redis-server --port 6388
            fi

            # 等待 PostgreSQL 就绪
            echo "==> 等待 PostgreSQL 就绪（最长 60 秒）"
            for i in $(seq 1 30); do
              if docker exec scx-backend-postgres pg_isready -U scx -p 5433 >/dev/null 2>&1; then
                echo "  PostgreSQL 就绪"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: PostgreSQL 60 秒内未就绪，终止部署"
                docker logs --tail 30 scx-backend-postgres || true
                exit 1
              fi
              echo "  等待 PG... ($i/30)"
              sleep 2
            done

            # ============================================================
            # 启动服务容器（先下游后网关）
            # --network host：各服务 localhost:<port> 互通
            # --env-file：注入 ECS 本地 .env（含 DB/JWT/MAIL/服务地址等）
            # ============================================================

            # 通用：停止并删除同名旧容器
            stop_and_rm() {
              docker stop "$1" 2>/dev/null || true
              docker rm   "$1" 2>/dev/null || true
            }
            
            # 迁移清理：移除历史单体容器（首次部署时不存在则自动跳过）
            stop_and_rm scx-backend
            
            echo "==> 启动 identity-service (3001)"
            stop_and_rm scx-identity
            docker run -d \
              --name scx-identity \
              --network host \
              --restart=always \
              --env-file "$ENV_FILE" \
              "$NS/identity-service:latest"

            echo "==> 启动 rbac-service (3002)"
            stop_and_rm scx-rbac
            docker run -d \
              --name scx-rbac \
              --network host \
              --restart=always \
              --env-file "$ENV_FILE" \
              "$NS/rbac-service:latest"

            echo "==> 启动 notification-service (3003)"
            stop_and_rm scx-notification
            docker run -d \
              --name scx-notification \
              --network host \
              --restart=always \
              --env-file "$ENV_FILE" \
              "$NS/notification-service:latest"

            echo "==> 启动 file-service (3004)"
            stop_and_rm scx-file
            docker run -d \
              --name scx-file \
              --network host \
              --restart=always \
              --env-file "$ENV_FILE" \
              "$NS/file-service:latest"

            # 网关依赖下游服务，最后启动；.env 中 IDENTITY/RBAC/NOTIFICATION/FILE_BASE_URL
            # 指向 http://localhost:<port>（host 网络下各服务互通）
            echo "==> 启动 gateway (8080)"
            stop_and_rm scx-gateway
            docker run -d \
              --name scx-gateway \
              --network host \
              --restart=always \
              --env-file "$ENV_FILE" \
              "$NS/gateway:latest"

            echo "==> 清理悬空镜像"
            docker image prune -f

            # 健康检查：轮询网关 /api/health（最多 180 秒）
            # /api/health 经网关转发到 identity，需 identity（连 PG+Flyway）与网关都就绪。
            # 网关启动较慢（buildpack 初始化 + 路由装配约 35s），给足余量。
            echo "==> 健康检查: 轮询 http://localhost:8080/api/health"
            for i in $(seq 1 36); do
              if curl -fsS http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "健康检查通过（第 $((i*5)) 秒）"
                echo "--- 运行中的服务容器 ---"
                docker ps --filter "name=scx-" --format "table {{.Names}}\t{{.Status}}"
                exit 0
              fi
              echo "  等待服务启动... ($i/36)"
              sleep 5
            done

            echo "ERROR: 健康检查超时（180 秒内网关未就绪）"
            echo "--- 全部容器状态 ---"
            docker ps -a --filter "name=scx-" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            echo "--- gateway 容器最近日志 ---"
            docker logs --tail 80 scx-gateway || true
            echo "--- identity-service 容器最近日志 ---"
            docker logs --tail 30 scx-identity || true
            exit 1
