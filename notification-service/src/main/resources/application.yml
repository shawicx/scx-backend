# notification-service 配置（骨架，Step 3 迁入完整配置）
spring:
  application:
    name: scx-notification
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "optional:file:.env[.properties]"

server:
  port: ${NOTIFICATION_PORT:3003}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.scx.backend: DEBUG
